version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"

  - package-ecosystem: "nuget"
    directory: "/"
    schedule:
      interval: "weekly"
    ignore:
      # SkiaSharp.HarfBuzz is held at 3.119.2 because later versions require a newer
      # HarfBuzzSharp than the 8.3.1.3 native library Avalonia 12.1.1 ships. Remove this
      # rule when Avalonia moves to a newer HarfBuzzSharp.
      - dependency-name: "SkiaSharp.HarfBuzz"
      # SkiaSharp must match the version Avalonia renders with: Avalonia 12.1.1 pins
      # SkiaSharp.NativeAssets.Linux at 3.119.4, and a newer managed SkiaSharp would run
      # against that older native library on Linux. Update it together with Avalonia.
      - dependency-name: "SkiaSharp"
