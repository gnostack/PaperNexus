name: PR Build Verification

on:
  pull_request:
    branches: ['main']

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v7

    - name: Set up .NET
      uses: actions/setup-dotnet@v6
      with:
        dotnet-version: '10.0.x'

    # PaperNexus.Desktop.slnf is the solution without PaperNexus.Android: the desktop host, the
    # shared library and both test projects. The Android host is built by its own workflow
    # (pull-request-android.yml), so this one needs no Android workload.
    - name: Restore dependencies
      run: dotnet restore PaperNexus.Desktop.slnf

    - name: Build
      run: dotnet build PaperNexus.Desktop.slnf --configuration Release --no-restore

    - name: Test
      run: dotnet test PaperNexus.Desktop.slnf --configuration Release --no-build --verbosity normal
      continue-on-error: true
