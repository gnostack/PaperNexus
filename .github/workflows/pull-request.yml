name: PR Build Verification

on:
  pull_request:
    branches: ['main']

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v7

    - name: Set up .NET
      uses: actions/setup-dotnet@v6
      with:
        dotnet-version: '10.0.x'

    # Installs the .NET workloads the solution's projects need: today the android workload for
    # PaperNexus.Android. The runner image has the Android SDK and a JDK but no .NET workloads,
    # and without it restoring the solution fails. The list comes from the projects themselves.
    - name: Install .NET workloads
      run: dotnet workload restore

    - name: Restore dependencies
      run: dotnet restore

    - name: Build
      run: dotnet build --configuration Release --no-restore

    - name: Test
      run: dotnet test --configuration Release --no-build --verbosity normal
      continue-on-error: true
